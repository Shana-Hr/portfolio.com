<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilshan Rathnayake | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--gui:#c6c6c6;--gui-d:#8b8b8b;--ink:#2b2b2b;--gold:#fcd34d;--grass:#7cc242;--red:#d9534f;--purple:#5b3f8c;--night:#0b0816}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:'VT323',monospace;font-size:21px;line-height:1.25;color:#efe6d0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% -10%,#3b2b63,transparent 60%),linear-gradient(#0b0816,#1c1433 70%,#0b0816)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
header,main,footer{position:relative;z-index:1}
a{color:inherit}
button{font-family:inherit}

/* ---------- top bar ---------- */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,8,22,.88);backdrop-filter:blur(6px);border-bottom:3px solid #000}
.brand{font:12px 'Press Start 2P',monospace;color:var(--gold);text-decoration:none;text-shadow:2px 2px 0 #000;white-space:nowrap}
.links{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.links a{font:9px 'Press Start 2P',monospace;color:#efe6d0;text-decoration:none;padding:8px 9px;border:2px solid #000;background:#2a2042;white-space:nowrap}
.links a.on,.links a:hover{background:var(--gold);color:#000}
#menuBtn{margin-left:auto;width:44px;height:40px;font:16px 'Press Start 2P',monospace;color:#fff;background:var(--purple);border:3px solid #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),3px 3px 0 #000;cursor:pointer;display:none}
#menuBtn:focus-visible,.links a:focus-visible,.btn:focus-visible,.mlink:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
@media (max-width:760px){.links{display:none}#menuBtn{display:block}}

/* ---------- mobile menu (dropdown) ---------- */
#menu{position:fixed;top:64px;left:10px;right:10px;z-index:30;max-width:460px;margin-left:auto;background:var(--gui);color:var(--ink);border:4px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555,0 14px 30px rgba(0,0,0,.6);padding:12px;display:grid;gap:8px;animation:pop .18s steps(4)}
.mhead{font:10px 'Press Start 2P',monospace;color:#fff;background:var(--gui-d);padding:8px;border:2px solid #000;text-shadow:2px 2px 0 #373737}
.mlink{font:10px 'Press Start 2P',monospace;color:var(--ink);text-decoration:none;background:#dcdcdc;border:3px solid #000;padding:12px 10px;box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #888;display:flex;justify-content:space-between;align-items:center}
.mlink:hover,.mlink:active{background:var(--gold)}
.mlink.play{background:var(--red);color:#fff;text-shadow:2px 2px 0 #000}

/* ---------- hero ---------- */
.hero{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 18px 50px}
.shana{position:relative;width:min(64vw,250px);aspect-ratio:1;display:grid;place-items:center;background:#2a2042;border:4px solid #000;box-shadow:0 0 0 4px var(--purple),0 0 50px rgba(252,211,77,.22);margin-bottom:22px;animation:float 3.2s ease-in-out infinite}
.shana img{width:88%;height:88%;object-fit:contain;image-rendering:pixelated}
.shana canvas{width:70%;height:70%;image-rendering:pixelated}
.shana::after{content:"";position:absolute;inset:-18px;border:2px dashed rgba(252,211,77,.35);border-radius:50%;animation:spin 14s linear infinite;pointer-events:none}
.kicker{font:9px 'Press Start 2P',monospace;color:#9be15d;letter-spacing:2px;margin-bottom:10px}
.name{font:clamp(14px,4.4vw,24px)/1.5 'Press Start 2P',monospace;color:var(--gold);text-shadow:3px 3px 0 #000;max-width:900px}
.role{font-size:clamp(20px,4vw,28px);color:#9be15d;margin:12px 0 6px;min-height:1.3em}
.caret{animation:blink 1s steps(2) infinite}
.loc{font-size:20px;opacity:.85;margin-bottom:22px}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:10px 'Press Start 2P',monospace;color:#fff;text-decoration:none;background:var(--purple);border:3px solid #000;padding:14px 14px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),4px 4px 0 #000;transition:transform .08s}
.btn.red{background:var(--red)}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.scroll{margin-top:34px;font:12px 'Press Start 2P',monospace;color:var(--gold);text-decoration:none;animation:bob 1.6s steps(2) infinite}

/* ---------- panels (minecraft GUI style) ---------- */
main{padding:0 14px 30px}
.panel{max-width:940px;margin:26px auto;background:var(--gui);color:var(--ink);border:4px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555,8px 8px 0 rgba(0,0,0,.5);padding:22px 18px 18px;opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}
.panel.in{opacity:1;transform:none}
.panel h2{font:12px 'Press Start 2P',monospace;color:#fff;background:var(--gui-d);border:3px solid #000;padding:9px 12px;margin-bottom:16px;text-shadow:2px 2px 0 #373737;display:inline-block}
.panel p{font-size:22px;line-height:1.3;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
.stat{background:var(--gui-d);border:3px solid #000;padding:10px;box-shadow:inset 3px 3px 0 #aaa,inset -3px -3px 0 #555;color:#fff}
.stat small{display:block;font:8px 'Press Start 2P',monospace;opacity:.85;margin-bottom:6px}
.stat b{font-weight:400;font-size:22px}
.row{display:flex;justify-content:space-between;font-size:22px;margin-top:12px}
.bar{height:18px;background:#373737;border:3px solid #000;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--grass) 0 10px,#4a9a38 10px 12px);transition:width 1.4s steps(14)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:#dcdcdc;border:3px solid #000;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #888;transition:transform .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--purple),#2a2042);display:grid;place-items:center;border-bottom:3px solid #000;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb span{font:26px 'Press Start 2P',monospace;color:var(--gold);text-shadow:3px 3px 0 #000}
.cbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody h3{font:11px/1.5 'Press Start 2P',monospace}
.cbody p{font-size:20px;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tags span{font:8px 'Press Start 2P',monospace;background:var(--grass);border:2px solid #000;color:#000;padding:4px 5px}
.open{margin-top:6px;align-self:flex-start;font:9px 'Press Start 2P',monospace;color:#fff;background:var(--purple);border:3px solid #000;padding:8px 10px;text-decoration:none}
.tl{position:relative;padding-left:30px;border-left:4px solid #000;margin-left:8px}
.tl-item{position:relative;margin:0 0 14px;padding:10px 12px;background:#dcdcdc;border:3px solid #000}
.tl-item::before{content:"";position:absolute;left:-43px;top:14px;width:16px;height:16px;background:var(--gold);border:3px solid #000}
.tl-item h3{font:10px/1.6 'Press Start 2P',monospace;margin-bottom:4px}
.tl-item small{font-size:18px;opacity:.8}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.contact a{font:10px 'Press Start 2P',monospace;color:#fff;text-decoration:none;text-align:center;padding:16px 10px;border:3px solid #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),4px 4px 0 #000}
.contact a.dis{opacity:.45;pointer-events:none}
footer{text-align:center;font:8px 'Press Start 2P',monospace;color:#8c7fa6;padding:10px 14px 40px;line-height:2}

@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bob{50%{transform:translateY(4px)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.panel{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<header class="nav">
  <a class="brand" href="#top">SHANA</a>
  <nav class="links" id="links" aria-label="Sections"></nav>
  <button id="menuBtn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">☰</button>
</header>

<div id="menu" hidden role="menu">
  <div class="mhead">MENU</div>
  <div id="mlinks" style="display:grid;gap:8px"></div>
  <a class="mlink play" href="play.html" role="menuitem">▶ PLAY GAME <span>→</span></a>
</div>

<main>
  <section class="hero" id="top">
    <div class="shana">
      <img id="shanaImg" src="images/shana.png" alt="Shana" onerror="this.hidden=true;document.getElementById('av').hidden=false">
      <canvas id="av" width="24" height="24" hidden aria-label="Shana pixel character"></canvas>
    </div>
    <p class="kicker">PLAYER ONE</p>
    <h1 class="name" id="nm">DILSHAN RATHNAYAKE</h1>
    <p class="role"><span id="role"></span><span class="caret">_</span></p>
    <p class="loc" id="loc"></p>
    <div class="cta">
      <a class="btn red" href="play.html">▶ PLAY GAME</a>
      <a class="btn" href="#contact">CONTACT</a>
    </div>
    <a class="scroll" href="#about" aria-label="Scroll down">▼</a>
  </section>
  <div id="sections"></div>
</main>

<footer>© DILSHAN "SHANA" RATHNAYAKE<br>BUILT WITH PIXELS</footer>

<script src="avatar.js"></script>
<script src="quick.js"></script>
</body>
</html>
